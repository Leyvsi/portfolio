<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Inscription — Les Petits Enquêteurs</title>
		<link rel="stylesheet" href="styles.css">
	</head>
	<body>
		<header class="header">
			<div class="top">
				<a class="logo" href="index.html">◈ LES PETITS <span>ENQUÊTEURS</span></a>
				<a class="outline" href="connexion.html">Connexion</a>
			</div>
			<nav class="nav" aria-label="Navigation principale">
				<a href="index.html">Accueil</a>
				<a href="histoires.html">Histoires</a>
				<a href="coldcases.html">Cold Cases</a>
				<a href="theories.html">Analyse & Théories</a>
				<a href="proposer-histoire.html">Proposer une histoire</a>
			</nav>
		</header>
		<main>
			<section class="section narrow">
				<div class="panel">
					<p class="eyebrow">ESPACE MEMBRE</p>
					<h1>Inscription</h1>
					<form id="signup-form" class="demo-form" method="post">
						<label for="pseudo">Nom d’utilisateur</label>
						<input id="pseudo" name="username" type="text" autocomplete="username" maxlength="100" required>
						<label for="email">E-mail</label>
						<input id="email" name="email" type="email" autocomplete="email" maxlength="150" required>
						<label for="password">Mot de passe</label>
						<input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="50" aria-describedby="signup-password-help">
						<small id="signup-password-help">8 à 50 caractères : majuscule, minuscule, chiffre et caractère spécial (ex. !, ?, @).</small>
						<button class="btn" type="submit">Créer mon compte</button>
						<p class="feedback" aria-live="polite"></p>
					</form>
					<p><a href="connexion.html">Se connecter</a></p>
				</div>
			</section>
		</main>
		<footer>
			Les Petits Enquêteurs · Projet étudiant
			<a href="admin-connexion.html">Administration</a>
		</footer>
		<script src="donnees.js"></script>
		<script src="api.js"></script>
		<script src="app.js"></script>
	</body>
</html>
